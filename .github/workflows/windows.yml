name: Windows CI and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build application
        shell: pwsh
        run: ./Build.ps1
      - name: Test configuration and local terminals
        shell: pwsh
        run: ./Test.ps1
      - name: Test IPv6 output extraction
        shell: pwsh
        run: node ./tests/Ipv6CaptureTests.js
      - name: Test live replacement state isolation
        shell: pwsh
        run: node ./tests/LiveReplaceStateTests.js
      - name: Test terminal transfer and flow references
        shell: pwsh
        run: node ./tests/PaneTransferTests.js
      - name: Test bundled SQA command templates
        shell: pwsh
        run: node ./tests/DefaultCommandsTests.js
      - name: Test NAN workflow generation
        shell: pwsh
        run: node ./tests/NanWorkflowTests.js
      - name: Test output matching and iperf evidence
        shell: pwsh
        run: node ./tests/FlowOutputTests.js
      - name: Test TC batch import
        shell: pwsh
        run: node ./tests/TestCaseImportTests.js
      - name: Test Android AP state checks
        shell: pwsh
        run: python -B ./tests/WifiApTests.py
      - name: Test workbench and TC USB preflight
        shell: pwsh
        run: |
          $testDeps = Join-Path $env:RUNNER_TEMP 'terminal-grid-ui'
          npm install --prefix $testDeps --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Playwright.' }
          $env:NODE_PATH = Join-Path $testDeps 'node_modules'
          node ./tests/WorkbenchUiTests.js
      - name: Package Windows release
        id: package
        shell: pwsh
        run: |
          $version = (Get-Item ./TerminalGridIntegrated.exe).VersionInfo.FileVersion -replace '\.0$', ''
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application versions differ.' }
          ./Package.ps1 -Version $version -SkipBuild
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Check versioned in-app help
        shell: pwsh
        run: node ./tests/ReleaseHelpTests.js
      - name: Test package update and data preservation
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: ./tests/UpdatePackageTests.ps1 -Package "./.release/TerminalGrid-Windows-x64-v$env:PACKAGE_VERSION.zip"
      - name: Upload ZIP and SHA-256
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: TerminalGrid-Windows-x64
          path: |
            .release/TerminalGrid-Windows-x64-v${{ steps.package.outputs.version }}.zip
            .release/TerminalGrid-Windows-x64-v${{ steps.package.outputs.version }}.zip.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download the tested package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: TerminalGrid-Windows-x64
          path: release-assets
      - name: Verify checksum and publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $name = "TerminalGrid-Windows-x64-v$env:PACKAGE_VERSION.zip"
          $zip = Join-Path release-assets $name
          $checksum = "$zip.sha256"
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath $checksum -Raw).Trim() -cne "$hash  $name") { throw 'Release checksum mismatch.' }
          $notes = (Get-Content -LiteralPath RELEASE_NOTES.md -Raw) -split '(?m)^## ', 2
          if (-not $notes[0].StartsWith("# Terminal Grid $env:PACKAGE_VERSION")) { throw 'Release notes version mismatch.' }
          $notesPath = Join-Path $env:RUNNER_TEMP 'terminal-grid-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes[0].TrimEnd())
          gh release create $env:GITHUB_REF_NAME $zip $checksum --verify-tag --title "Terminal Grid $env:PACKAGE_VERSION" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
